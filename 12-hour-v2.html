<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeV – Szolgálati visszaszámláló</title>
<style>
  :root { --cyan:#38d6ff; --purple:#806bff; }
  * { box-sizing:border-box; }
  html,body {
    margin:0; width:100%; height:100%; overflow:hidden;
    background:transparent; font-family:Inter,"Segoe UI",Arial,sans-serif;
  }
  body { display:grid; place-items:center; }
  .panel {
    display:flex; align-items:center; gap:18px;
    padding:15px 23px; border-radius:15px;
    color:#f5f8ff;
    background:linear-gradient(120deg,rgba(8,15,31,.94),rgba(20,23,48,.93));
    border:1px solid rgba(100,190,255,.28);
    box-shadow:0 0 22px rgba(56,214,255,.16), inset 0 0 18px rgba(128,107,255,.08);
    position:relative; overflow:hidden; white-space:nowrap;
  }
  .panel::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,var(--cyan),var(--purple));
    box-shadow:0 0 12px var(--cyan);
  }
  .label {
    font-size:17px; font-weight:750; letter-spacing:.025em;
    text-shadow:0 0 12px rgba(56,214,255,.25);
  }
  .remaining {
    color:#aebbd0; font-size:14px; font-weight:650;
  }
  .time {
    color:var(--cyan); font-size:30px; line-height:1;
    font-weight:850; letter-spacing:.045em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 13px rgba(56,214,255,.48);
  }
  .done .time { color:#50e3a4; text-shadow:0 0 13px rgba(80,227,164,.45); }
  @media(max-width:520px) {
    .panel { gap:10px; padding:12px 15px; }
    .label { font-size:14px; }
    .remaining { font-size:12px; }
    .time { font-size:24px; }
  }
</style>
</head>
<body>
  <main class="panel" id="panel">
    <span class="label">12 órás szolgálat</span>
    <span class="remaining">Hátralévő:</span>
    <span class="time" id="time">12:00:00</span>
  </main>
<script>
(() => {
  const duration = 12 * 60 * 60 * 1000;
  const key = "freev_service_countdown_end_v2";
  const timeEl = document.getElementById("time");
  const panel = document.getElementById("panel");
  let endAt;
  try { endAt = Number(localStorage.getItem(key)); } catch (_) {}
  if (!Number.isFinite(endAt) || endAt <= Date.now()) {
    endAt = Date.now() + duration;
    try { localStorage.setItem(key, String(endAt)); } catch (_) {}
  }
  function render() {
    const secondsLeft = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    const h = Math.floor(secondsLeft / 3600);
    const m = Math.floor((secondsLeft % 3600) / 60);
    const s = secondsLeft % 60;
    timeEl.textContent = [h,m,s].map(v => String(v).padStart(2,"0")).join(":");
    if (secondsLeft === 0) panel.classList.add("done");
  }
  function reset() {
    endAt = Date.now() + duration;
    try { localStorage.setItem(key, String(endAt)); } catch (_) {}
    panel.classList.remove("done");
    render();
  }
  window.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "r") reset();
  });
  render();
  setInterval(render, 200);
})();
</script>
</body>
</html>
